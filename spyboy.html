<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPY Bot Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Mono', monospace; background: #0a0a0a; color: #e8e8e8; min-height: 100vh; padding: 24px; }
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap');

  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 0.5px solid #2a2a2a; padding-bottom: 16px; }
  .header h1 { font-family: 'IBM Plex Sans', sans-serif; font-size: 18px; font-weight: 500; letter-spacing: 0.05em; color: #fff; }
  .header h1 span { color: #4ade80; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; display: inline-block; margin-right: 8px; animation: pulse 2s infinite; }
  .status-dot.closed { background: #f87171; animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .market-status { font-size: 12px; color: #888; display: flex; align-items: center; }

  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .metric { background: #111; border: 0.5px solid #222; border-radius: 8px; padding: 14px 16px; }
  .metric-label { font-size: 11px; color: #666; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
  .metric-value { font-size: 22px; font-weight: 500; color: #e8e8e8; }
  .metric-value.green { color: #4ade80; }
  .metric-value.red { color: #f87171; }
  .metric-value.yellow { color: #fbbf24; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .card { background: #111; border: 0.5px solid #222; border-radius: 10px; padding: 16px; }
  .card-title { font-size: 11px; color: #666; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 14px; }

  .signal-badge { display: inline-block; padding: 6px 16px; border-radius: 4px; font-size: 20px; font-weight: 500; letter-spacing: 0.1em; }
  .signal-badge.BUY { background: rgba(74, 222, 128, 0.1); color: #4ade80; border: 0.5px solid #4ade80; }
  .signal-badge.SELL { background: rgba(248, 113, 113, 0.1); color: #f87171; border: 0.5px solid #f87171; }
  .signal-badge.HOLD { background: rgba(251, 191, 36, 0.1); color: #fbbf24; border: 0.5px solid #fbbf24; }

  .indicator-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 0.5px solid #1a1a1a; font-size: 13px; }
  .indicator-row:last-child { border-bottom: none; }
  .ind-label { color: #666; }
  .ind-value { color: #e8e8e8; font-weight: 500; }
  .ind-value.bull { color: #4ade80; }
  .ind-value.bear { color: #f87171; }

  .reason-tag { display: inline-block; background: #1a1a1a; border: 0.5px solid #333; border-radius: 4px; padding: 3px 8px; font-size: 11px; color: #888; margin: 3px 3px 3px 0; }

  .trade-row { display: grid; grid-template-columns: 1fr 60px 50px 80px; gap: 8px; padding: 8px 0; border-bottom: 0.5px solid #1a1a1a; font-size: 12px; align-items: center; }
  .trade-row:last-child { border-bottom: none; }
  .trade-time { color: #666; }
  .trade-side { font-weight: 500; text-align: center; padding: 2px 6px; border-radius: 3px; font-size: 11px; }
  .trade-side.buy { background: rgba(74,222,128,0.1); color: #4ade80; }
  .trade-side.sell { background: rgba(248,113,113,0.1); color: #f87171; }
  .trade-qty { color: #888; text-align: right; }
  .trade-price { color: #e8e8e8; text-align: right; font-weight: 500; }
  .no-trades { color: #444; font-size: 13px; text-align: center; padding: 20px 0; }

  .chart-wrap { position: relative; width: 100%; height: 200px; margin-bottom: 20px; }
  canvas { border-radius: 4px; }

  .config-section { background: #111; border: 0.5px solid #222; border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  .config-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .config-field { display: flex; flex-direction: column; gap: 6px; }
  .config-field label { font-size: 11px; color: #666; letter-spacing: 0.06em; text-transform: uppercase; }
  .config-field input { background: #0a0a0a; border: 0.5px solid #333; border-radius: 6px; padding: 8px 10px; color: #e8e8e8; font-family: 'IBM Plex Mono', monospace; font-size: 13px; width: 100%; }
  .config-field input:focus { outline: none; border-color: #4ade80; }
  .btn { background: transparent; border: 0.5px solid #4ade80; color: #4ade80; padding: 8px 18px; border-radius: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; cursor: pointer; transition: all 0.15s; margin-top: 12px; }
  .btn:hover { background: rgba(74,222,128,0.08); }
  .btn.danger { border-color: #f87171; color: #f87171; }
  .btn.danger:hover { background: rgba(248,113,113,0.08); }
  .btn-row { display: flex; gap: 10px; }

  .footer { font-size: 11px; color: #444; text-align: center; margin-top: 24px; }
  .last-update { font-size: 11px; color: #444; }

  .price-big { font-size: 36px; font-weight: 500; color: #fff; }
  .price-change { font-size: 14px; margin-left: 8px; }
  .price-change.up { color: #4ade80; }
  .price-change.down { color: #f87171; }
</style>
</head>
<body>

<div class="header">
  <h1>SPY <span>BOT</span> — Paper Trading</h1>
  <div style="display:flex;align-items:center;gap:16px;">
    <span class="last-update" id="last-update">--</span>
    <span class="market-status"><span class="status-dot" id="market-dot"></span><span id="market-status">Checking...</span></span>
  </div>
</div>

<div style="margin-bottom:20px;">
  <span class="price-big" id="spy-price">$---.--</span>
  <span class="price-change" id="spy-change"></span>
</div>

<div class="metrics">
  <div class="metric">
    <div class="metric-label">Equity</div>
    <div class="metric-value" id="equity">$--</div>
  </div>
  <div class="metric">
    <div class="metric-label">Cash</div>
    <div class="metric-value" id="cash">$--</div>
  </div>
  <div class="metric">
    <div class="metric-label">Today P&L</div>
    <div class="metric-value" id="pnl">$--</div>
  </div>
  <div class="metric">
    <div class="metric-label">Position</div>
    <div class="metric-value" id="position">-- shares</div>
  </div>
</div>

<div class="chart-wrap">
  <canvas id="priceChart"></canvas>
</div>

<div class="grid-2">
  <div class="card">
    <div class="card-title">Signal</div>
    <div style="margin-bottom:16px;">
      <span class="signal-badge HOLD" id="signal-badge">HOLD</span>
    </div>
    <div class="indicator-row">
      <span class="ind-label">RSI (14)</span>
      <span class="ind-value" id="rsi">--</span>
    </div>
    <div class="indicator-row">
      <span class="ind-label">MA Fast (9)</span>
      <span class="ind-value" id="ma-fast">--</span>
    </div>
    <div class="indicator-row">
      <span class="ind-label">MA Slow (21)</span>
      <span class="ind-value" id="ma-slow">--</span>
    </div>
    <div class="indicator-row">
      <span class="ind-label">VWAP</span>
      <span class="ind-value" id="vwap">--</span>
    </div>
    <div style="margin-top:12px;" id="reasons"></div>
  </div>

  <div class="card">
    <div class="card-title">Recent Trades</div>
    <div id="trades-list"><div class="no-trades">No trades yet</div></div>
  </div>
</div>

<div class="config-section">
  <div class="card-title">Configuration</div>
  <div class="config-row">
    <div class="config-field">
      <label>Alpaca API Key</label>
      <input type="password" id="api-key" placeholder="pk_..." />
    </div>
    <div class="config-field">
      <label>Alpaca Secret</label>
      <input type="password" id="api-secret" placeholder="..." />
    </div>
    <div class="config-field">
      <label>Trade Qty (shares)</label>
      <input type="number" id="trade-qty" value="1" min="1" />
    </div>
    <div class="config-field">
      <label>Mode</label>
      <input type="text" id="mode" value="paper" readonly style="color:#fbbf24;" />
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" onclick="saveConfig()">Save Config</button>
    <button class="btn danger" onclick="manualSell()">Force Sell All</button>
  </div>
</div>

<div class="footer">SPY Bot v1.0 — Paper trading only — Not financial advice</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
  let priceHistory = [];
  let chart;
  let apiKey = localStorage.getItem('alpaca_key') || '';
  let apiSecret = localStorage.getItem('alpaca_secret') || '';
  let tradeQty = parseInt(localStorage.getItem('trade_qty') || '1');

  document.getElementById('api-key').value = apiKey;
  document.getElementById('api-secret').value = apiSecret;
  document.getElementById('trade-qty').value = tradeQty;

  function saveConfig() {
    apiKey = document.getElementById('api-key').value;
    apiSecret = document.getElementById('api-secret').value;
    tradeQty = parseInt(document.getElementById('trade-qty').value);
    localStorage.setItem('alpaca_key', apiKey);
    localStorage.setItem('alpaca_secret', apiSecret);
    localStorage.setItem('trade_qty', tradeQty);
    alert('Config saved. Restart bot.py with these credentials.');
  }

  function fmt(n) { return '$' + parseFloat(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
  function fmtTime(iso) { if(!iso) return '--'; const d = new Date(iso); return d.toLocaleTimeString('en-US', {hour:'2-digit',minute:'2-digit'}); }

  function initChart() {
    const ctx = document.getElementById('priceChart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          data: [],
          borderColor: '#4ade80',
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0.3,
          fill: true,
          backgroundColor: (ctx) => {
            const g = ctx.chart.ctx.createLinearGradient(0,0,0,200);
            g.addColorStop(0,'rgba(74,222,128,0.12)');
            g.addColorStop(1,'rgba(74,222,128,0)');
            return g;
          }
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { color: '#1a1a1a' }, ticks: { color: '#444', font: { size: 10 }, maxTicksLimit: 6 } },
          y: { grid: { color: '#1a1a1a' }, ticks: { color: '#444', font: { size: 10 }, callback: v => '$' + v.toFixed(2) }, position: 'right' }
        }
      }
    });
  }

  async function fetchAlpacaData() {
    if (!apiKey || !apiSecret) {
      showMockData();
      return;
    }
    try {
      const headers = { 'APCA-API-KEY-ID': apiKey, 'APCA-API-SECRET-KEY': apiSecret };
      const [accountRes, barsRes, posRes] = await Promise.all([
        fetch('https://paper-api.alpaca.markets/v2/account', { headers }),
        fetch('https://data.alpaca.markets/v2/stocks/SPY/bars?timeframe=5Min&limit=60&adjustment=raw', { headers }),
        fetch('https://paper-api.alpaca.markets/v2/positions/SPY', { headers }).catch(() => null)
      ]);

      if (accountRes.ok) {
        const acct = await accountRes.json();
        document.getElementById('equity').textContent = fmt(acct.equity);
        document.getElementById('cash').textContent = fmt(acct.cash);
        const pnl = parseFloat(acct.equity) - parseFloat(acct.last_equity);
        const pnlEl = document.getElementById('pnl');
        pnlEl.textContent = (pnl >= 0 ? '+' : '') + fmt(pnl);
        pnlEl.className = 'metric-value ' + (pnl >= 0 ? 'green' : 'red');
      }

      if (barsRes.ok) {
        const barsData = await barsRes.json();
        const bars = barsData.bars || [];
        if (bars.length > 0) {
          const latest = bars[bars.length - 1];
          const prev = bars[bars.length - 2] || bars[0];
          const price = latest.c;
          const change = price - prev.c;
          const pct = (change / prev.c * 100);
          document.getElementById('spy-price').textContent = fmt(price);
          const chEl = document.getElementById('spy-change');
          chEl.textContent = (change >= 0 ? '+' : '') + fmt(change) + ' (' + pct.toFixed(2) + '%)';
          chEl.className = 'price-change ' + (change >= 0 ? 'up' : 'down');

          const labels = bars.map(b => fmtTime(b.t));
          const prices = bars.map(b => b.c);
          chart.data.labels = labels;
          chart.data.datasets[0].data = prices;
          chart.update('none');

          computeSignal(bars);
        }
      }

      if (posRes && posRes.ok) {
        const pos = await posRes.json();
        document.getElementById('position').textContent = pos.qty + ' shares';
        document.getElementById('position').className = 'metric-value green';
      } else {
        document.getElementById('position').textContent = '0 shares';
        document.getElementById('position').className = 'metric-value';
      }

      const tradesRes = await fetch('https://paper-api.alpaca.markets/v2/orders?status=filled&limit=10&symbols=SPY', { headers });
      if (tradesRes.ok) {
        const orders = await tradesRes.json();
        renderTrades(orders);
      }

      document.getElementById('market-status').textContent = 'Market Open';
      document.getElementById('market-dot').className = 'status-dot';
    } catch(e) {
      console.error(e);
    }
    document.getElementById('last-update').textContent = 'Updated ' + new Date().toLocaleTimeString();
  }

  function computeSignal(bars) {
    const closes = bars.map(b => b.c);
    const volumes = bars.map(b => b.v);
    const highs = bars.map(b => b.h);
    const lows = bars.map(b => b.l);

    const rsi = calcRSI(closes, 14);
    const maFast = calcMA(closes, 9);
    const maSlow = calcMA(closes, 21);
    const vwap = calcVWAP(highs, lows, closes, volumes);

    const n = closes.length - 1;
    const latestRsi = rsi[n];
    const latestClose = closes[n];
    const latestVwap = vwap[n];
    const maCrossBull = maFast[n] > maSlow[n] && maFast[n-1] <= maSlow[n-1];
    const maCrossBear = maFast[n] < maSlow[n] && maFast[n-1] >= maSlow[n-1];

    let score = 0;
    let reasons = [];

    if (latestRsi < 30) { score += 2; reasons.push('RSI oversold (' + latestRsi.toFixed(1) + ')'); }
    else if (latestRsi > 70) { score -= 2; reasons.push('RSI overbought (' + latestRsi.toFixed(1) + ')'); }
    if (maCrossBull) { score += 2; reasons.push('Bullish MA crossover'); }
    else if (maCrossBear) { score -= 2; reasons.push('Bearish MA crossover'); }
    if (latestClose > latestVwap) { score += 1; reasons.push('Above VWAP'); }
    else { score -= 1; reasons.push('Below VWAP'); }

    const signal = score >= 3 ? 'BUY' : score <= -3 ? 'SELL' : 'HOLD';

    const badge = document.getElementById('signal-badge');
    badge.textContent = signal;
    badge.className = 'signal-badge ' + signal;

    document.getElementById('rsi').textContent = latestRsi.toFixed(1);
    document.getElementById('rsi').className = 'ind-value ' + (latestRsi < 30 ? 'bull' : latestRsi > 70 ? 'bear' : '');
    document.getElementById('ma-fast').textContent = '$' + maFast[n].toFixed(2);
    document.getElementById('ma-slow').textContent = '$' + maSlow[n].toFixed(2);
    document.getElementById('ma-fast').className = 'ind-value ' + (maFast[n] > maSlow[n] ? 'bull' : 'bear');
    document.getElementById('vwap').textContent = '$' + latestVwap.toFixed(2);
    document.getElementById('vwap').className = 'ind-value ' + (latestClose > latestVwap ? 'bull' : 'bear');

    const reasonsEl = document.getElementById('reasons');
    reasonsEl.innerHTML = reasons.map(r => '<span class="reason-tag">' + r + '</span>').join('');
  }

  function calcRSI(closes, period) {
    const rsi = new Array(closes.length).fill(50);
    for (let i = period; i < closes.length; i++) {
      let gains = 0, losses = 0;
      for (let j = i - period + 1; j <= i; j++) {
        const d = closes[j] - closes[j-1];
        if (d > 0) gains += d; else losses -= d;
      }
      const rs = gains / (losses || 0.001);
      rsi[i] = 100 - (100 / (1 + rs));
    }
    return rsi;
  }

  function calcMA(closes, period) {
    return closes.map((_, i) => {
      if (i < period - 1) return closes[i];
      return closes.slice(i - period + 1, i + 1).reduce((a,b) => a+b, 0) / period;
    });
  }

  function calcVWAP(highs, lows, closes, volumes) {
    let cumTPV = 0, cumVol = 0;
    return closes.map((c, i) => {
      const tp = (highs[i] + lows[i] + c) / 3;
      cumTPV += tp * volumes[i];
      cumVol += volumes[i];
      return cumTPV / (cumVol || 1);
    });
  }

  function renderTrades(orders) {
    const el = document.getElementById('trades-list');
    if (!orders || orders.length === 0) {
      el.innerHTML = '<div class="no-trades">No trades yet</div>';
      return;
    }
    el.innerHTML = orders.map(o => `
      <div class="trade-row">
        <span class="trade-time">${fmtTime(o.filled_at)}</span>
        <span class="trade-side ${o.side}">${o.side.toUpperCase()}</span>
        <span class="trade-qty">${o.filled_qty}x</span>
        <span class="trade-price">${o.filled_avg_price ? fmt(o.filled_avg_price) : '--'}</span>
      </div>`).join('');
  }

  function showMockData() {
    document.getElementById('equity').textContent = '$1,000.00';
    document.getElementById('cash').textContent = '$1,000.00';
    document.getElementById('pnl').textContent = '$0.00';
    document.getElementById('position').textContent = '0 shares';
    document.getElementById('spy-price').textContent = '$---';
    document.getElementById('market-status').textContent = 'Add API keys';
    document.getElementById('market-dot').className = 'status-dot closed';

    const labels = Array.from({length:60}, (_,i) => i + ':00');
    const prices = Array.from({length:60}, (_,i) => 580 + Math.sin(i/5)*2 + Math.random());
    chart.data.labels = labels;
    chart.data.datasets[0].data = prices;
    chart.update('none');
    document.getElementById('last-update').textContent = 'Demo mode';
  }

  async function manualSell() {
    if (!confirm('Force sell all SPY positions?')) return;
    alert('To force sell, run: python3 bot.py --force-sell\n(or place order manually in Alpaca dashboard)');
  }

  initChart();
  fetchAlpacaData();
  setInterval(fetchAlpacaData, 30000);
</script>
</body>
</html>
